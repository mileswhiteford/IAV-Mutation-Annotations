name: Collect vocab

on:
  push:
    paths:
      - "annotations/**"
      - "vocab/**/standard.csv"
      - "scripts/collect_vocab.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vocab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect_vocab.py
      - name: Commit updated vocab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add vocab/
          git diff --cached --quiet || git commit -m "Update observed vocab"
          git push
